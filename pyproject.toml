[project]
name = "rsserpent-plugins"
version = "0.3.0"
description = "Official RSSerpent plugins"
requires-python = ">=3.14,<3.16"
readme = "README.md"
license = "MIT"
license-files = ["rsserpent_plugins/*/LICENSE"]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "arrow",
    "feedgen",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "pydantic>=2.12,<3",
    "rsserpent-rev>=0.3,<0.4",
    "starlette",
    "yarl",
]

[project.urls]
Repository = "https://github.com/RSSerpent-Rev/rsserpent-plugins"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "rsserpent-rev @ git+https://github.com/RSSerpent-Rev/RSSerpent.git@9e42e56855aa180bfeb5ad2f271d795e668e13f8",
    "uvicorn>=0.29,<1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.9,<0.14"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
