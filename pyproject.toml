[project]
name = "rsserpent-plugins"
version = "0.3.0"
description = "Official RSSerpent plugins"
requires-python = ">=3.14,<3.16"
readme = "README.md"
license = "MIT"
license-files = ["rsserpent_plugins/*/LICENSE"]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "arrow",
    "feedgen",
    "feedparser>=6.0.11,<7",
    "feedparser-to-feedgen @ git+https://github.com/EkkoG/feedparser-to-feedgen.git@6f8e2555cdc5e603fcba0f53e4379af98305ef00",
    "lxml>=6,<7",
    "rsserpent-rev>=0.2,<0.4",
    "starlette",
    "yarl",
]

[project.urls]
Repository = "https://github.com/RSSerpent-Rev/rsserpent-plugins"

[dependency-groups]
dev = [
    "httpx",
    "httpx2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "rsserpent-rev @ git+https://github.com/RSSerpent-Rev/RSSerpent.git@1da58cea79344b2c1ad881c117d0587dd1e04169",
    "uvicorn>=0.29,<1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.9,<0.14"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
