[project]
name = "rsserpent-plugin-csj-sdk-update"
version = "0.2.0"
description = "An rsserpent plugin for update."
requires-python = ">=3.14,<3.16"
authors = [{ name = "Ekko", email = "beijiu572@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["rss"]
dependencies = [
    "arrow",
    "rsserpent-rev>=0.2,<0.3",
]

[project.urls]
Repository = "https://github.com/RSSerpent-Rev/rsserpent-plugins"

[project.entry-points."rsserpent.plugin"]
csj-sdk-update = "rsserpent_plugin_csj_sdk_update:plugin"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
