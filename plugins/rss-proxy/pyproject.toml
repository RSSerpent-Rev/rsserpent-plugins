[project]
name = "rsserpent-plugin-rss-proxy"
version = "0.2.0"
description = "An rsserpent plugin for proxy."
requires-python = ">=3.14,<3.16"
authors = [{ name = "EkkoG", email = "beijiu572@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["rss"]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "feedparser-to-feedgen @ git+https://github.com/EkkoG/feedparser-to-feedgen.git@6f8e2555cdc5e603fcba0f53e4379af98305ef00",
    "feedparser>=6.0.11,<7",
    "rsserpent-rev>=0.2,<0.3",
    "starlette",
    "yarl",
]

[project.urls]
Repository = "https://github.com/RSSerpent-Rev/rsserpent-plugins"

[project.entry-points."rsserpent.plugin"]
rss-proxy = "rsserpent_plugin_rss_proxy:plugin"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
