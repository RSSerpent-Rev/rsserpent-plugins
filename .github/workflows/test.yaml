name: Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yaml'
      - '.python-version'
      - 'rsserpent_plugins/**'
      - 'tests/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/test.yaml'
      - '.python-version'
      - 'rsserpent_plugins/**'
      - 'tests/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - name: Check official plugin routes
        env:
          RSSERPENT_PROXY_SOURCES: "https://example.org/feed.xml"
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from pkgutil import iter_modules

          import rsserpent_plugins

          packages = sorted(module.name for module in iter_modules(rsserpent_plugins.__path__) if module.ispkg)
          modules = ", ".join(f'"rsserpent_plugins.{name}"' for name in packages)
          Path("rsserpent.test.toml").write_text(f"plugins = [{modules}]\n")
          PY
          uv run --no-sync rsserpent check --config rsserpent.test.toml
      - run: uv build
